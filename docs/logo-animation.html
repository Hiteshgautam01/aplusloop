<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A+ LOOP Logo Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: 'Inter', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 220px;
      width: 100vw;
      background: #fff;
      box-shadow: 0 2px 16px rgba(0,0,0,0.04);
      margin-bottom: 40px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .logo-svg {
      width: 120px;
      height: 120px;
      /* Animation target */
      will-change: transform, filter, opacity;
    }
    .logo-svg path {
      stroke: #1736dc;
      stroke-width: 8;
      fill-opacity: 1;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: draw-path 1.2s cubic-bezier(0.77,0,0.175,1) forwards;
    }
    .logo-svg path:nth-child(2) { animation-delay: 0.2s; }
    .logo-svg path:nth-child(3) { animation-delay: 0.4s; }
    .logo-svg path:nth-child(4) { animation-delay: 0.6s; }
    .logo-svg path:nth-child(5) { animation-delay: 0.8s; }
    .logo-svg path:nth-child(6) { animation-delay: 1.0s; }
    .logo-svg path:nth-child(7) { animation-delay: 1.2s; }
    @keyframes draw-path {
      to {
        stroke-dashoffset: 0;
      }
    }
    .logo-text {
      font-size: 4rem;
      font-weight: 900;
      color: #111;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s 1.7s cubic-bezier(0.77,0,0.175,1), transform 0.7s 1.7s cubic-bezier(0.77,0,0.175,1);
    }
    .logo-text.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 600px) {
      .logo-text { font-size: 2.2rem; }
      .logo-svg { width: 70px; height: 70px; }
      header { height: 120px; }
    }
    .draw-path {
      stroke: #1736dc;
      stroke-width: 8;
      fill: none;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: draw-path 1.2s cubic-bezier(0.77,0,0.175,1) forwards;
    }
    .draw-path.filled {
      fill-opacity: 1;
      fill: url(#linearGradient28);
      stroke: none;
      transition: fill 0.5s;
    }
    .draw-loop {
      stroke: #1736dc;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw-loop 1.2s 1.5s cubic-bezier(0.77,0,0.175,1) forwards;
    }
    .draw-loop.filled {
      fill: #1736dc;
      stroke: none;
      transition: fill 0.5s;
    }
    @keyframes draw-path {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes draw-loop {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

      <svg class="logo-text-svg" width="220" height="80" viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="60" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" stroke="#1736dc" stroke-width="2" fill="none" class="draw-loop">LOOP</text>
      </svg>

  </header>
  <script>
    // Animate SVG drawing and text entrance
    window.addEventListener('DOMContentLoaded', () => {
      const paths = document.querySelectorAll('.draw-path');
      paths.forEach((path, i) => {
        path.style.strokeDasharray = path.getTotalLength();
        path.style.strokeDashoffset = path.getTotalLength();
        path.style.animationDelay = `${i * 0.2}s`;
      });
      // Fill logo after draw
      setTimeout(() => {
        paths.forEach((path, i) => {
          path.classList.add('filled');
        });
      }, 1500);
      // Animate LOOP text
      const loopText = document.querySelector('.draw-loop');
      setTimeout(() => {
        loopText.classList.add('filled');
      }, 2700);
    });
  </script>
